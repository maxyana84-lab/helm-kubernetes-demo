{{- $ctx := dict "root" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bg.fullname" . }}
  labels:
    {{- include "bg.labels" $ctx | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bg.fullname" . }}
                port: {number: {{ .Values.service.port }}}
---
{{- /* NGINX canary annotations belong on the canary Ingress, not on the primary one. */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bg.suffixed" (dict "root" . "suffix" "canary") }}
  labels:
    {{- include "bg.labels" $ctx | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "{{ .Values.canary.weight }}"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bg.greenServiceName" . }}
                port: {number: {{ .Values.service.port }}}
