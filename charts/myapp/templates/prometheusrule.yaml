{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $ctx := dict "root" . "component" "backend" }}
{{- $be := include "myapp.componentName" $ctx }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "myapp.fullname" . }}
  labels:
    {{- include "myapp.labels" $ctx | nindent 4 }}
spec:
  groups:
    - name: {{ include "myapp.fullname" . }}.rules
      rules:
        - alert: MyappBackendDown
          expr: 'sum(up{job="{{ $be }}"}) == 0'
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "No backend instances are up in {{ .Release.Namespace }}"
        - alert: MyappPodRestarting
          expr: 'increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",pod=~"{{ include "myapp.fullname" . }}-.*"}[15m]) > 3'
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Pod {{`{{ $labels.pod }}`}} is restarting repeatedly"
        - alert: MyappHighCPU
          expr: 'avg(rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}",pod=~"{{ $be }}-.*"}[5m])) > 0.8'
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Backend CPU usage is high"
{{- end }}
