{{- $ctx := dict "root" . "component" "frontend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myapp.componentName" $ctx }}
  labels:
    {{- include "myapp.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "myapp.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: API_URL
              value: "http://{{ include "myapp.componentName" (dict "root" . "component" "backend") }}:{{ .Values.backend.service.port }}"
            {{- range $k, $v := .Values.frontend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
