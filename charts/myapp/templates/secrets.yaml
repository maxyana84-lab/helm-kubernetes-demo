{{- $name := include "myapp.secretsName" . }}
{{- $ctx := dict "root" . "component" "database" }}
{{- if eq .Values.secrets.mode "configmap" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "myapp.labels" $ctx | nindent 4 }}
data:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
{{- else if eq .Values.secrets.mode "sealed" }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "myapp.labels" $ctx | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml (required "secrets.sealed.encryptedData is required when secrets.mode is sealed" .Values.secrets.sealed.encryptedData) | nindent 4 }}
  template:
    metadata:
      name: {{ $name }}
      labels:
        {{- include "myapp.labels" $ctx | nindent 8 }}
{{- else if eq .Values.secrets.mode "external" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "myapp.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.external.secretStore }}
    kind: {{ .Values.secrets.external.secretStoreKind }}
  target:
    name: {{ $name }}
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ required "secrets.external.remoteKey is required when secrets.mode is external" .Values.secrets.external.remoteKey }}
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.external.remoteKey }}
        property: password
{{- else }}
{{- fail (printf "secrets.mode must be one of configmap, sealed, external (got %q)" .Values.secrets.mode) }}
{{- end }}
