{{- if .Values.ingress.enabled }}
{{- $ctx := dict "root" . "component" "frontend" }}
{{- $tls := .Values.ingress.tls }}
{{- $tlsSecret := default (printf "%s-tls" (include "myapp.fullname" . | trunc 56 | trimSuffix "-")) $tls.secretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "myapp.fullname" . }}
  labels:
    {{- include "myapp.labels" $ctx | nindent 4 }}
  {{- if or .Values.ingress.annotations (and $tls.enabled (eq $tls.mode "cert-manager")) }}
  annotations:
    {{- if and $tls.enabled (eq $tls.mode "cert-manager") }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "myapp.componentName" (dict "root" . "component" "backend") }}
                port: {number: {{ .Values.backend.service.port }}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "myapp.componentName" $ctx }}
                port: {number: {{ .Values.frontend.service.port }}}
{{- if and $tls.enabled (eq $tls.mode "self-signed") }}
{{- $cert := genSelfSignedCert .Values.ingress.host nil (list .Values.ingress.host) 365 }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $tlsSecret }}
  labels:
    {{- include "myapp.labels" $ctx | nindent 4 }}
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
