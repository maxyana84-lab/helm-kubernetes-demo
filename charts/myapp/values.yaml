# Base values = sensible defaults for DEV. Staging/prod override only the differences.
environment: dev
nameOverride: ""
fullnameOverride: ""
imagePullPolicy: IfNotPresent

frontend:
  # Public stand-in image (static web server). Replace with your Node.js frontend image.
  image: {repository: nginxinc/nginx-unprivileged, tag: "1.27-alpine"}
  replicas: 1
  port: 8080
  healthPath: /
  service: {type: NodePort, port: 80, nodePort: 30080}
  env: {}
  resources: {}

backend:
  # Public stand-in image (HTTP API with /status/200). Replace with your FastAPI backend image.
  image: {repository: mccutchen/go-httpbin, tag: "v2.15.0"}
  replicas: 1
  port: 8080
  healthPath: /status/200
  service: {type: NodePort, port: 8000, nodePort: 30800}
  env:
    LOG_LEVEL: debug
  resources: {}

database:
  external: false            # true -> no StatefulSet, ConfigMap with connection string instead
  image: {repository: postgres, tag: "16-alpine"}
  port: 5432
  name: appdb
  storage: 1Gi
  service: {type: NodePort, nodePort: 30432}
  resources: {}
  # used only when external: true
  externalHost: ""
  externalPort: 5432
  backupSchedule: "0 3 * * *"
  backup:
    enabled: false
    storage: 2Gi
    retentionDays: 7

# Credentials: configmap (plain, dev only) | sealed (SealedSecret) | external (ExternalSecret, AWS)
secrets:
  mode: configmap
  postgresUser: app
  postgresPassword: devpassword      # plain text: dev only!
  sealed:
    encryptedData: {}                # POSTGRES_USER / POSTGRES_PASSWORD from `kubeseal`
  external:
    secretStore: aws-secrets-manager
    secretStoreKind: ClusterSecretStore
    remoteKey: ""                    # AWS Secrets Manager secret name, JSON with username/password
    refreshInterval: 1h

ingress:
  enabled: false
  className: nginx
  host: myapp.example.com
  annotations: {}
  tls:
    enabled: false
    mode: self-signed                # self-signed | cert-manager
    secretName: ""
    clusterIssuer: letsencrypt-prod  # used when mode: cert-manager

# NOTE: minReplicas/maxReplicas/targetCPU intentionally have no defaults:
# with enabled: true all three are required (see templates/hpa.yaml).
autoscaling:
  enabled: false

pdb:
  enabled: false
  minAvailable: 2

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics
  prometheusRule:
    enabled: false
