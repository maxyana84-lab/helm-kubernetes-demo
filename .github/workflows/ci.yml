name: helm-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint (default, dev, prod values)
        run: |
          helm lint charts/webapp
          helm lint charts/webapp -f charts/webapp/values-dev.yaml
          helm lint charts/webapp -f charts/webapp/values-prod.yaml
      - name: Helm template (render manifests)
        run: |
          helm template demo charts/webapp -f charts/webapp/values-prod.yaml > /tmp/rendered.yaml
          grep -c '^kind:' /tmp/rendered.yaml

  myapp-multi-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every environment
        run: |
          for env in dev staging prod; do
            helm lint charts/myapp -f charts/myapp/values-$env.yaml
            helm template myapp charts/myapp -f charts/myapp/values-$env.yaml > /tmp/$env.yaml
          done
      - name: Check what each environment renders
        run: |
          ! grep -q '^kind: StatefulSet' /tmp/prod.yaml
          grep -q '^kind: StatefulSet' /tmp/dev.yaml
          grep -q '^kind: HorizontalPodAutoscaler' /tmp/prod.yaml
          ! grep -q '^kind: HorizontalPodAutoscaler' /tmp/staging.yaml
          ! grep -q '^kind: Ingress' /tmp/dev.yaml
      - name: HPA must fail without autoscaling.targetCPU
        run: |
          sed '/targetCPU/d' charts/myapp/values-prod.yaml > /tmp/prod-nocpu.yaml
          if helm template myapp charts/myapp -f /tmp/prod-nocpu.yaml 2> /tmp/err.txt; then
            echo "expected failure"; exit 1
          fi
          grep "autoscaling.targetCPU is required" /tmp/err.txt

  exercise-2-library-umbrella:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Build trtech-lib, services and platform dependencies
        run: ./exercise-2/build.sh
      - name: Lint
        run: helm lint exercise-2/platform
      - name: Render counts (all enabled / notification disabled)
        working-directory: exercise-2
        run: |
          count() { grep -c "^kind: $1\$" "$2"; }
          helm template platform ./platform > /tmp/all.yaml
          helm template platform ./platform --set notification-service.enabled=false > /tmp/no-notif.yaml
          [ "$(count Deployment /tmp/all.yaml)" = 4 ] && [ "$(count Service /tmp/all.yaml)" = 4 ]
          [ "$(count NetworkPolicy /tmp/all.yaml)" = 4 ] && [ "$(count PodDisruptionBudget /tmp/all.yaml)" = 1 ]
          [ "$(count Deployment /tmp/no-notif.yaml)" = 3 ] && [ "$(count Service /tmp/no-notif.yaml)" = 3 ]
          [ "$(count NetworkPolicy /tmp/no-notif.yaml)" = 3 ]

  exercise-3-bluegreen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint exercise-3/bluegreen
          helm lint exercise-3/bluegreen --set rollback.enabled=true
      - name: Rendered resources and hooks
        working-directory: exercise-3/bluegreen
        run: |
          count() { grep -c "^kind: $1\$" "$2"; }
          helm template bg . > /tmp/default.yaml
          for k in Deployment:2 Service:2 Ingress:2 ServiceAccount:1 Role:1 RoleBinding:1 Job:3 PrometheusRule:1; do
            [ "$(count "${k%%:*}" /tmp/default.yaml)" = "${k##*:}" ] || { echo "unexpected count for $k"; exit 1; }
          done
          grep -q 'helm.sh/hook-weight": "-5"' /tmp/default.yaml
          grep -q 'helm.sh/hook-weight": "0"' /tmp/default.yaml
          grep -q 'helm.sh/hook-weight": "5"' /tmp/default.yaml
          grep -c 'serviceAccountName: bg-bluegreen-hooks' /tmp/default.yaml | grep -qx 3
          grep -q 'CanaryErrorRateHigh' /tmp/default.yaml
      - name: Canary weight annotation and validation
        working-directory: exercise-3/bluegreen
        run: |
          helm template bg . --set canary.weight=10 | grep -q 'canary-weight: "10"'
          if helm template bg . --set canary.weight=25 2> /tmp/err.txt; then echo "weight 25 must fail"; exit 1; fi
          grep -q 'canary.weight must be one of' /tmp/err.txt
      - name: Replicas follow the hooks (Helm reverts live drift)
        working-directory: exercise-3/bluegreen
        run: |
          reps() { helm template bg . "$@" | awk '/^kind: Deployment/{d=1} d&&/^  name:/{n=$2} d&&/^  replicas:/{print n"="$2; d=0}'; }
          [ "$(reps)" = "$(printf 'bg-bluegreen-blue=2\nbg-bluegreen-green=0')" ]
          [ "$(reps --is-upgrade)" = "$(printf 'bg-bluegreen-blue=2\nbg-bluegreen-green=2')" ]
          [ "$(reps --is-upgrade --set rollback.enabled=true)" = "$(printf 'bg-bluegreen-blue=2\nbg-bluegreen-green=0')" ]
      - name: Rollback renders only the rollback hook
        working-directory: exercise-3/bluegreen
        run: |
          helm template bg . --set rollback.enabled=true > /tmp/rollback.yaml
          [ "$(grep -c '^kind: Job' /tmp/rollback.yaml)" = 1 ]
          grep -q 'name: bg-bluegreen-rollback' /tmp/rollback.yaml
          ! grep -q 'smoke-test' /tmp/rollback.yaml
          ! grep -q 'name: bg-bluegreen-cutover' /tmp/rollback.yaml

  install-on-kind:
    runs-on: ubuntu-latest
    needs: lint-and-template
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
      - name: Install chart (dev values) and wait until ready
        run: |
          helm install demo charts/webapp -f charts/webapp/values-dev.yaml --wait --timeout 120s
          kubectl get pods,svc
      - name: Smoke test through port-forward
        run: |
          kubectl port-forward svc/demo-webapp 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080 | grep "Environment: dev"
      - name: Upgrade to default values and roll back
        run: |
          helm upgrade demo charts/webapp --wait --timeout 120s
          helm history demo
          helm rollback demo 1 --wait --timeout 120s
